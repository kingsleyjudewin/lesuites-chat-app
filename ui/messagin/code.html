<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
        
        body {
            background-color: #110e07; /* surface-container-lowest */
        }
        
        .marble-texture {
            background-image: url('data:image/svg+xml;utf8,<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.03" fill="%23ffffff"/></svg>');
        }
        
        .glass-panel {
            background: rgba(31, 27, 19, 0.6); /* surface-container-low with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .gold-separator {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(242, 202, 80, 0.3), transparent);
        }

        .gold-border-focus:focus-within {
            border-color: #f2ca50; /* primary */
            box-shadow: 0 0 0 1px rgba(242, 202, 80, 0.2);
        }

        .gold-glint:hover {
            position: relative;
            overflow: hidden;
        }
        
        .gold-glint:hover::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: glint 1.5s ease-in-out infinite;
        }
        
        @keyframes glint {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(242, 202, 80, 0.5);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .5; transform: scale(1.1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #38342b; /* surface-variant */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4d4635; /* outline-variant */
        }
