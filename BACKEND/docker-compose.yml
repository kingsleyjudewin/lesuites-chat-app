version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  encryption-service:
    build: ./encryption-service
    restart: unless-stopped
    env_file: ./encryption-service/.env
    ports:
      - "8001:8001"

  node-backend:
    build: ./node-backend
    restart: unless-stopped
    env_file: ./node-backend/.env
    depends_on:
      - mongo
      - encryption-service
    ports:
      - "4000:4000"

volumes:
  mongo-data:
